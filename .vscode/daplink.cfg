# Wireless CMSIS-DAP probe, STM32F103.
source [find interface/cmsis-dap.cfg]
# Disable command pipelining for probe firmware compatibility.
cmsis-dap quirk enable
transport select swd
source [find target/stm32f1x.cfg]
# Apply after the target script, which sets its own adapter speed.
adapter speed 100
reset_config none
